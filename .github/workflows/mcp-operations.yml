name: MCP cost guard and lifecycle
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        default: check
        options: [check, shutdown, rollback]
permissions:
  contents: read
  id-token: write
concurrency:
  group: mcp-production
  cancel-in-progress: false
jobs:
  guard:
    if: vars.MCP_AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment: mcp-production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.MCP_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.MCP_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.MCP_AZURE_SUBSCRIPTION_ID }}
      - name: Enforce cost and experiment end
        shell: pwsh
        env:
          OPERATION: ${{ inputs.operation || 'check' }}
        run: ./mcp-experiment/scripts/operations.ps1 -Operation $env:OPERATION
