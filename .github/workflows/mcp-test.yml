name: MCP tests
on:
  pull_request:
    paths: ['mcp-experiment/**', 'system/logparser-core.js', 'system/samples/**', 'nettools/subnet-core.js', 'nettools/subnet-calculator.html', 'nettools/subnet-planner.html', '.github/workflows/mcp-*.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp-experiment/package-lock.json
      - run: npm ci --ignore-scripts && npm test
        working-directory: mcp-experiment
      - run: node scripts/evaluate.mjs
        working-directory: mcp-experiment
      - name: Test billing retries and shutdown
        shell: pwsh
        run: ./mcp-experiment/scripts/test-cost-guard.ps1
      - run: az bicep build --file mcp-experiment/infra/main.bicep --stdout > /dev/null
      - run: az bicep build --file mcp-experiment/infra/app.bicep --stdout > /dev/null
