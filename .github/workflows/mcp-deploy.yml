name: Deploy MCP experiment
on:
  workflow_dispatch:
    inputs:
      existing_image_revision:
        description: 'Optional already-built immutable r... image tag to resume; blank builds this commit'
        required: false
        type: string
        default: ''
permissions:
  contents: read
  id-token: write
concurrency:
  group: mcp-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: mcp-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp-experiment/package-lock.json
      - run: npm ci --ignore-scripts && npm test
        working-directory: mcp-experiment
      - run: node scripts/evaluate.mjs
        working-directory: mcp-experiment
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.MCP_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.MCP_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.MCP_AZURE_SUBSCRIPTION_ID }}
      - name: Deploy and validate candidate revision
        shell: pwsh
        env:
          MCP_IMAGE_REVISION: ${{ inputs.existing_image_revision }}
        run: |
          $parameters = @{ Revision = ('r' + '${{ github.sha }}'.Substring(0,12)) }
          if ($env:MCP_IMAGE_REVISION) {
            $parameters.Revision = $env:MCP_IMAGE_REVISION
            $parameters.UseExistingImage = $true
          }
          ./mcp-experiment/scripts/deploy.ps1 @parameters
